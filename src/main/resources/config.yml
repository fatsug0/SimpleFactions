# Use this config file to personalize the factions plugins to your likings

faction:

  # Base options around the faction object (faction object being the faction class creating a faction)
  object:
    base-faction-power: 2
    base-faction-power-per-member: 1
    weak-claims-enabled: true
    weak-amount-coefficient: 1.5

  # What is blocked in these types of claims (hard/weak)
  hard-claim:
    block-break: false
    block-place: false
    interact: false
    pvp: false
    entity-damage: false
    fire-spread: false
    tnt-explosion: false
  weak-claim:
    block-break: false
    block-place: false
    interact: true
    pvp: true
    entity-damage: true
    fire-spread: false
    tnt-explosion: false

  powerToChunkSelectionCoefficient: 1.25

# Enable the BlueMap addon of the plugin (be able to see the different factions on BlueMap)
enable-bluemap-addon: true

# Debug / testing options - do not leave these enabled on a real server
debug:
  # If true, ALL saved faction data (factions, claims, invites, raids) is wiped from memory
  # every time the plugin starts, regardless of what's saved on disk. Useful for repeatedly
  # testing faction creation/permissions from a clean slate without deleting data files by hand.
  wipe-factions-on-start: false